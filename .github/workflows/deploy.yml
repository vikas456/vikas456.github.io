# Deploys the site to GitHub Pages.
#
# Live. Every push to master publishes to https://www.vikasperaka.com, and the
# workflow can also be run by hand from the Actions tab.
#
# Pages source is set to "GitHub Actions" in repo settings; the contact form key
# comes from the PUBLIC_WEB3FORMS_KEY repository secret.

name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Contact form delivery. Add this under
          # Settings -> Secrets and variables -> Actions -> New repository secret.
          # If the secret is absent the build still succeeds and the form falls
          # back to opening the visitor's mail client.
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
          # Chat widget backend (the Cloudflare Worker URL). The widget is not
          # rendered at all until this is set, so it is safe to deploy without.
          PUBLIC_CHAT_ENDPOINT: ${{ secrets.PUBLIC_CHAT_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
